[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flatmatch"
version = "0.1.0"
description = "FlatMatch - A smart apartment and roommate matching system"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "FlatMatch Development Team" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["flatmatch*"]
